[project]
name = "igaming-redirect-pathfinder"
version = "1.0.0"
description = "Enterprise Outbound Affiliate Link Chain & Latency Tracker (iGaming-Redirect-Pathfinder)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "dnspython>=2.6",
  "tldextract>=5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
